<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Responsive Todo List App</title>
    <link rel="stylesheet" href="../CSS/style.css" />
    <link rel="shortcut icon" href="https://th.bing.com/th/id/OIP.mtoBS5m-4Uy-UVhPomRwqAHaHa?w=220&h=220&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" type="image/x-icon">
  </head>
  <body>
    <div class="container">
      <h1>Task Manager</h1>
      <div class="input-group">
        <input type="text" id="taskInput" placeholder="Enter task..." />
        <input type="datetime-local" id="taskDateTime" />
        <button onclick="addTask()">Add Task</button>
      </div>
      <!-- Controls row -->
      <div class="controls">
        <button class="showall-btn" onclick="filterTasks('all')">
          Show All
        </button>
        <button class="pending-btn" onclick="filterTasks('pending')">
          Pending
        </button>
        <button class="completed-btn" onclick="filterTasks('completed')">
          Completed
        </button>
        <button id="themeBtn" class="theme-btn" onclick="toggleTheme()">
          ☀️
        </button>
      </div>
      <ul id="taskList" class="task-list"></ul>
    </div>
    <script src="../JS/script.js"></script>
  </body>
</html>
